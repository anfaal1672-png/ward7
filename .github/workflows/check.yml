# ward7.html は game/src から組み立てる。手で ward7.html だけを直すと
# 源と食い違い、次に組み立てた人の変更で黙って消える。それを CI で止める。
name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 源と ward7.html・three.min.js の一致・構文
        run: npm run check
      - name: 静的な検め（未定義の名前など。設計指示書 第 15.2 節）
        run: mkdir -p .check && npm run lint
      - name: 型の検め（源の TypeScript。設計指示書 第 15.2 節 手順 2）
        run: npm run typecheck
      - name: 型の締め具合の歯止め（章ごとの型の無い数が控えより増えたら落とす。第 15.2 節）
        run: node .tools/any-ratchet.js
      - name: 状態の保存と巻き戻し（取って進めた跡と、戻して進めた跡が一致する。第 15.3 節）
        working-directory: .tools
        env:
          WARD7_FILE: ${{ github.workspace }}/ward7.html
          WARD7_FAST: "1"
        run: node snap-check.js 0 9200 9202 && node snap-check.js 5 9201

  # 実ブラウザ（Chromium + SwiftShader）での自己診断と、遊びの確認。
  # ハーネス（jsdom）はシェーダを通さないので、ここでしか見えない壊れ方がある（.tools/README）。
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 自己診断（4 段階の品質）
        run: node .tools/stq.js "$PWD/ward7.html"
      - name: 章・物語・捕獲・投擲・保存・パッド・英語
        run: |
          for t in chapter-check story-check capture-check throw-check door-check look-check bench-check keys-check tips-check layout-check sfx-check tape-check foot-check store-check pad-check padmenu-check drs-check hrtf-check tele-check; do
            echo "== $t"; node .tools/$t.js "$PWD/ward7.html"
          done
          echo "== model-shot"; node .tools/model-shot.js "$PWD/ward7.html" /tmp/md medbox
          node .tools/lang-check.js "$PWD/ward7.html" | tee /tmp/lang.txt
          ! grep -E "残り [1-9]" /tmp/lang.txt
          node .tools/offline-check.js
